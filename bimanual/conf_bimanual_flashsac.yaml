defaults:
  - conf_bimanual_gmr
  - _self_

wandb:
  project: "musclemimic"
  mode: "online"
  tags: ["bimanual", "gmr", "flashsac"]

experiment:
  algorithm: FlashSACJax
  task_factory:
    params:
      amass_dataset_conf:
        max_motions: 384
        max_motions_seed: 0
        write_materialized_cache: true
  env_params:
    num_envs: 512
  num_envs: ${experiment.env_params.num_envs}
  total_timesteps: 100000000
  online_logging_interval: 10
  normalize_env: false

  distributed:
    num_devices: 1
  trajectory:
    sharding: none
  n_seeds: 1
  exact_resume: false

  validation:
    active: true
    num: 50
    video_frequency: 20
  save_checkpoints: true
  checkpoints_on_validation: false
  checkpoint_interval: 8192
  max_checkpoints_to_keep: 2
  async_checkpointing: true
  checkpoint_include_replay_buffer: false
  auto_resume: true

  flashsac_config:
    buffer_capacity: 1048576
    min_buffer_size: 131072
    sample_batch_size: 2048
    replay_storage_dtype: bfloat16
    updates_per_interaction: 1
    gamma: 0.99
    normalize_reward: true
    normalized_return_max: 5.0

    actor_hidden_dim: 256
    actor_num_blocks: 4
    actor_update_period: 2
    critic_hidden_dim: 512
    critic_num_blocks: 4
    critic_num_bins: 101
    critic_min_value: -5.0
    critic_max_value: 5.0
    target_update_tau: 0.01

    initial_temperature: 0.01
    target_sigma: 0.20
    learning_rate: 3e-4
    end_learning_rate: 1.5e-4
    warmup_updates: 2000
    max_grad_norm: 1.0

    noise_zeta_exponent: 2.0
    noise_max_repeat: 16
