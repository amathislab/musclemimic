defaults:
  - conf_bimanual_gmr
  - _self_

wandb:
  project: "musclemimic"
  mode: "online"
  tags: ["bimanual", "gmr", "flashsac", "a5000"]

experiment:
  algorithm: FlashSACJax
  task_factory:
    params:
      amass_dataset_conf:
        # Bound the trajectory cache on a 24 GiB A5000 while reserving memory
        # for the 1M-transition replay and large critic.
        max_motions: 384
        max_motions_seed: 0
  env_params:
    # Prefer replay coverage over a very large vector step on a 24 GiB A5000.
    # 1M / 512 retains 2,048 interactions (20.48 s at 100 Hz).
    num_envs: 512
  num_envs: ${experiment.env_params.num_envs}
  total_timesteps: 100000000
  online_logging_interval: 10
  normalize_env: false

  validation:
    active: true
    num: 50
    video_frequency: 10
  save_checkpoints: true
  # A complete checkpoint contains the replay buffer. Avoid synchronously
  # writing a multi-GiB checkpoint at every validation.
  checkpoints_on_validation: false
  checkpoint_interval: 8192
  max_checkpoints_to_keep: 2
  async_checkpointing: true
  auto_resume: true

  flashsac_config:
    # The previous 131K / 2,048 profile retained only 64 interactions.
    buffer_capacity: 1048576
    min_buffer_size: 131072
    sample_batch_size: 2048
    replay_storage_dtype: bfloat16
    # One 2,048-sample update per 512 new transitions matches two updates per
    # 1,024 transitions, or four sampled items per new transition.
    updates_per_interaction: 1
    gamma: 0.99
    normalize_reward: true
    normalized_return_max: 5.0

    actor_hidden_dim: 256
    actor_num_blocks: 4
    actor_update_period: 2
    critic_hidden_dim: 512
    critic_num_blocks: 4
    critic_num_bins: 101
    critic_min_value: -5.0
    critic_max_value: 5.0
    target_update_tau: 0.01

    initial_temperature: 0.01
    target_sigma: 0.20
    learning_rate: 3e-4
    end_learning_rate: 1.5e-4
    warmup_updates: 2000
    max_grad_norm: 1.0

    noise_zeta_exponent: 2.0
    noise_max_repeat: 16
