defaults:
  - conf_fullbody_gmr_resnet  # Inherit from GMR config

# Override wandb tags
wandb:
  tags: ["fullbody", "gmr", "resnet", "baseline", "Gait120", "finetuned", "training-subjects"]

# Enable residual network
experiment:
  task_factory:
    params:
      amass_dataset_conf:
        dataset_group: "GAIT120_TRAINING_SUBJECTS"
  
  validation:
    amass_dataset_conf:
      dataset_group: "GAIT120_TESTING_SUBJECTS"

  checkpoint_root: "checkpoints/fullbody/gmr_resnet_Gait120_tr-subjects_finetuned"
  resume_from: hf://amathislab/mm-fullbody-base
  
