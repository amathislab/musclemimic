# MyoFullBody Soft MoE with transition dataset
# Inherits from conf_fullbody.yaml
defaults:
  - conf_fullbody
  - _self_

wandb:
  tags: ["fullbody", "moe", "transition"]

experiment:
  lr: 4e-4
  anneal_lr: false
  lr_schedule_type: "linear"
  num_minibatches: 8

  task_factory:
    params:
      amass_dataset_conf:
        dataset_group: "KIT_KINESIS_TRANSITION_TRAINING_MOTIONS"

  # Network architecture
  actor_hidden_layers: [1024, 1024, 1024, 1024, 1024]
  critic_hidden_layers: [1024, 1024, 1024, 1024, 1024]

  # Enable MoE
  use_moe: true
  moe_config:
    num_experts: 16
    moe_at_layers: [3]
    apply_moe_to: "both"
    apply_moe_to_output: false
    expert_hidden_ratio: 0.5
    temperature: 0.5
    load_balance_loss_weight: 0.01
    gate_init_std: 0.01
